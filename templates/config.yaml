# llama-swap config — шаблон.
#
# Копируется на ПК в <RIG_ROOT>\llama-swap\config.yaml, а в репо остаётся зеркало
# в rigs/<твой-стенд>/pc-mirrors/config.yaml — чтобы правки были под гитом.
#
# llama-swap слушает один порт, раздаёт OpenAI-совместимый API и по полю "model"
# в запросе поднимает нужный llama-server на внутреннем ${PORT}, а предыдущий глушит.
# Смысл в том, что в VRAM влезает одна модель за раз, а нужны разные.
#
# Подробности и грабли — docs/llama-swap.md
# Подбор -c / -ub / --n-cpu-moe под свою карту — docs/choosing-models.md
# Живой пример на 7 моделей — rigs/rtx5070ti-16gb/pc-mirrors/config.yaml

# Сколько ждать готовности модели, сек. Должно быть с запасом больше, чем грузится
# самая тяжёлая модель с диска, иначе прокси решит, что она не поднялась.
healthCheckTimeout: 300

# Выгрузить модель из VRAM после N секунд простоя. Для игрового ПК — ключевая настройка:
# видеопамять освобождается сама, и игра запускается без ручных плясок.
# Следующий запрос перегрузит модель (десяток-другой секунд).
# 0 = держать модель в VRAM всегда.
globalTTL: 1800

logLevel: info

macros:
  # Общие флаги для всех моделей — чтобы не повторять их в каждом блоке.
  # Модель, которой нужен другой бинарник (например форк llama.cpp),
  # этот макрос не использует и пишет команду целиком.
  #
  # ⚠️ Внутрь блока ниже комментарии добавлять НЕЛЬЗЯ: в YAML-скаляре ">" всё
  # отбитое отступом — это текст, и "# ..." уедет в аргументы llama-server.
  # Расшифровка флагов:
  #   -ngl 999                  все слои, какие влезут, — на GPU
  #   -fa on + cache-type q8_0  режут KV-кэш примерно вдвое, ставить всегда
  #   -t 6                      потоков CPU: по числу физических ядер, не логических
  #   --jinja                   чат-шаблон из GGUF (нужен для tool calling и thinking)
  server: >
    C:\llm\llama.cpp\llama-server.exe
    --port ${PORT}
    -ngl 999 -np 1 -fa on
    --cache-type-k q8_0 --cache-type-v q8_0
    -t 6 -b 2048 --jinja

models:
  # ── Пример 1: модель влезает в VRAM целиком (dense или компактная MoE) ──
  моя-модель:
    cmd: |
      ${server}
      -m C:\llm\models\моя-модель\weights.gguf
      -c 32768 -ub 512
      --temp 0.6 --top-p 0.95 --top-k 20
    # Стабильное имя для клиентов: повесь "default" на текущую прод-модель.
    # Поменяешь модель — перевесишь алиас, клиентов трогать не придётся.
    aliases:
      - default

  # ── Пример 2: MoE крупнее VRAM — эксперты части слоёв уезжают в RAM ──
  # Подбирается замером: увеличивай --n-cpu-moe, пока prefill не перестанет
  # обваливаться (обвал в десятки раз = спилловер, см. docs/choosing-models.md).
  моя-moe-модель:
    cmd: |
      ${server}
      -m C:\llm\models\моя-moe-модель\weights.gguf
      --n-cpu-moe 20 -c 102400 -ub 2048
      --temp 0.6 --top-p 0.95 --top-k 20

  # ── Пример 3: та же модель с другим режимом мышления ──
  # JSON-флаги нельзя передавать через cmd: llama-swap не снимает кавычки.
  # Только через env — у большинства флагов llama-server есть парный LLAMA_ARG_*.
  моя-модель-nothink:
    env:
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"enable_thinking":false}'
    cmd: |
      ${server}
      -m C:\llm\models\моя-модель\weights.gguf
      -c 32768 -ub 512
      --temp 0.6 --top-p 0.95 --top-k 20
